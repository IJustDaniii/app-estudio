services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: aula_1b
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d aula_1b"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - aula_1b_postgres:/var/lib/postgresql/data

volumes:
  aula_1b_postgres:
